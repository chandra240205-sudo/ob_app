{% extends "base.html" %}
{% block title %}Ganti password{% endblock %}
{% block isi %}
<div class="card" style="max-width:420px;margin:24px auto">
  <h1>Ganti password</h1>
  {% if user.must_change %}<p class="muted">Demi keamanan, password awal harus diganti sebelum memakai aplikasi.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>Password lama</label><input name="lama" type="password" autocomplete="current-password" required>
    <label>Password baru (min. 8 karakter)</label><input name="baru" type="password" autocomplete="new-password" required>
    <label>Ulangi password baru</label><input name="ulang" type="password" autocomplete="new-password" required>
    <p><button type="submit">Simpan</button></p>
  </form>
</div>
{% endblock %}
