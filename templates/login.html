{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block isi %}
<div class="card" style="max-width:380px;margin:32px auto">
  <div style="text-align:center;margin-bottom:8px">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" style="width:68px;height:68px;object-fit:cover;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,0.15)">
  </div>
  <h1 style="text-align:center;margin-top:4px">Masuk</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <p><button type="submit" style="width:100%">Masuk</button></p>
  </form>
  <div style="margin-top:16px;text-align:center">
    <p>Belum punya akun? <a href="{{ url_for('register') }}"><strong>Daftar di sini</strong></a></p>
  </div>
  <p class="muted" style="text-align:center;font-size:0.85rem">Lupa password? Minta supervisor mengembalikannya ke password awal.</p>
</div>
{% endblock %}
